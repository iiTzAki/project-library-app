<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>

</head>
<body>
    <div class="header-container">
        <div>
            <a href=".">
                <svg class="library-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M9 3V18H12V3H9M12 5L16 18L19 17L15 4L12 5M5 5V18H8V5H5M3 19V21H21V19H3Z"></path>
                </svg>                
            </a>
            <h1 class="header-text">Library</h1>
        </div>
        <button class="new-book-btn">New Book</button>
        <dialog id="new-book-dialog">
            <div class="dialog-wrapper">

                <button class="close-dialog-btn">Close</button>
                <h2>Add New Book</h2>

                <form class="dialog-form" id="book-dialog-form" action="">

                    <div class="form-input">
                        <label for="title-book">Book Title:</label>
                        <input autofocus type="text" name="title" id="title-book">
                    </div>

                    <div class="form-input">
                        <label for="author-book">Book's Author:</label>
                        <input type="text" name="author" id="author-book">
                    </div>
                    
                    <div class="form-input">
                        <label for="pages-book">Total Pages:</label>
                        <input type="number" name="total-pages" id="pages-book">
                    </div>

                    <fieldset>
                        <legend>Read Status</legend>
                        <div class="radio-tile-group">
                            <div class="input-container">
                                <input name="read-status" id="status-already-read" value="already read" class="read-status" type="radio">
                                <div class="radio-tile">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path d="M16.75 22.16L14 19.16L15.16 18L16.75 19.59L20.34
                                        16L21.5 17.41L16.75 22.16M17 4V10L15 8L13 10V4H9V20H12.08C12.2
                                        20.72 12.45 21.39 12.8 22H7C5.95 22 5 21.05 5 20V19H3V17H5V13H3V11H5V7H3V5H5V4C5 2.89 5.9 2 7 2H19C20.05 2 21 2.95 21
                                        4V13.8C20.39 13.45 19.72 13.2 19 13.08V4H17M5 19H7V17H5V19M5 13H7V11H5V13M5 7H7V5H5V7Z" />
                                    </svg>
                                    <label for="status-already-read">Already Read</label>
                                </div>
                            </div>
                            <div class="input-container">
                                <input id="status-not-read" name="read-status" value="not read yet" class="read-status" type="radio">
                                <div class="radio-tile">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path d="M17 4V10L15 8L13 10V4H9V20H12.1C12.2 20.7 12.5 21.4 12.8 22H7C5.9 22
                                        5 21 5 20V19H3V17H5V13H3V11H5V7H3V5H5V4C5 2.9 5.9 2 7 2H19C20 2 21 3 21 4V13.8C20.4 13.4 19.7
                                        13.2 19 13.1V4H17M5 19H7V17H5V19M5 13H7V11H5V13M5 7H7V5H5V7M20.1 15.5L18 17.6L15.9 15.5L14.5 16.9L16.6 19L14.5
                                        21.1L15.9 22.5L18 20.4L20.1 22.5L21.5 21.1L19.4 19L21.5 16.9L20.1 15.5Z" />
                                    </svg>
                                    <label for="status-not-read">Not Yet Read</label>
                                </div>
                            </div>
                        </div>
                    </fieldset>

                    <button id="form-submit-btn" type="submit">Add</button>                    
                </form>

            </div>
        </dialog>
        </div>
    </div>

    <div id="grid-container"></div>
</body>
</html>
