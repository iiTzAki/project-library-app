    <meta charset="UTF-8">

    <title>Library</title>

    <link rel="stylesheet" href="./style.css">
    <script src="./main.js" defer></script>

<body>
    <div class="header-container">
        <div>
            <a href=".">
                <svg class="library-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M9 3V18H12V3H9M12 5L16 18L19 17L15 4L12 5M5 5V18H8V5H5M3 19V21H21V19H3Z"></path>
                </svg>                
            </a>
            <h1 class="header-text">Library App</h1>
        </div>
        <button onclick=showNewBookDialog(true) class="new-book-btn">New Book</button>
        <dialog id="new-book-dialog">
            <div class="dialog-wrapper">

                <button>Close</button>
                <h2>Add New Book</h2>

                <form class="dialog-form" action="">

                    <div class="form-input">
                        <label for="title-book">Book Title:</label>
                        <input type="text" name="title" id="title-book" required>
                    </div>

                    <div class="form-input">
                        <label for="author-book">Book's Author:</label>
                        <input type="text" name="author" id="author-book" required>
                    </div>
                    
                    <div class="form-input">
                        <label for="pages-book">Total Pages:</label>
                        <input type="number" name="total-pages" id="pages-book" required>
                    </div>

                    <fieldset>
                        <legend>Read Status</legend>
                        <div class="radio-tile-group">
                            <div class="input-container">
                                <input name="read-status" id="status-already-read" type="radio">
                                <div class="radio-tile">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path d="M17,4V10L15,8L13,10V4H9V20H19V4H17M3,7V5H5V4C5,2.89 5.9,2 7,2H1
                                        9C20.05,2 21,2.95 21,4V20C21,21.05 20.05,22 19,22H7C5.95,22 5,21.05 5,20V19H3V17H5V13H3V11H5V7H3M5,
                                        5V7H7V5H5M5,19H7V17H5V19M5,13H7V11H5V13Z" />
                                    </svg>
                                    <label for="status-already-read">Already Read</label>
                                </div>
                            </div>
                            <div class="input-container">
                                <input id="status-not-read" name="read-status" type="radio">
                                <div class="radio-tile">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path d="M17,4V10L15,8L13,10V4H9V20H19V4H17M3,7V5H5V4C5,2.89 5.9,2 7,2H19C20.05,2 21,2.95 21,4V20C21,
                                        21.05 20.05,22 19,22H7C5.95,22 5,21.05 5,20V19H3V17H5V13H3V11H5V7H3M5,5V7H7V5H5M5,19H7V17H5V19M5,13H7V11H5V13Z" />
                                    </svg>
                                    <label for="status-not-read">Not Yet Read</label>
                                </div>
                            </div>
                        </div>
                    </fieldset>

                    <button id="form-submit-btn" type="submit">Create</button>                    
                </form>

            </div>
        </dialog>
        </div>
    </div>
